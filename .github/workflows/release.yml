name: Version and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deskbuddy-release
  cancel-in-progress: false

jobs:
  release:
    name: Test, Build, and Release
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run test suite
        run: swift test --disable-sandbox

      - name: Determine next version from Conventional Commits
        id: version
        run: ./scripts/next-version.sh >> "$GITHUB_OUTPUT"

      - name: Build app
        if: steps.version.outputs.should_release == 'true'
        env:
          DESKBUDDY_VERSION: ${{ steps.version.outputs.version }}
          DESKBUDDY_BUILD_NUMBER: ${{ github.run_number }}
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PUBLIC_KEY" || -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "SPARKLE_PUBLIC_KEY and SPARKLE_PRIVATE_KEY repository secrets are required." >&2
            exit 1
          fi
          ./build-app.sh

      - name: Package app as DMG
        if: steps.version.outputs.should_release == 'true'
        run: |
          STAGING="$(mktemp -d)"
          cp -R "outputs/DeskBuddy.app" "$STAGING/DeskBuddy.app"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create \
            -volname "DeskBuddy ${{ steps.version.outputs.version }}" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "DeskBuddy-${{ steps.version.outputs.version }}.dmg"

      - name: Generate release notes
        if: steps.version.outputs.should_release == 'true'
        run: ./scripts/release-notes.sh "${{ steps.version.outputs.version }}" release-notes.md

      - name: Generate signed Sparkle appcast
        if: steps.version.outputs.should_release == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          mkdir sparkle-release
          cp "DeskBuddy-${{ steps.version.outputs.version }}.dmg" sparkle-release/
          cp release-notes.md "sparkle-release/DeskBuddy-${{ steps.version.outputs.version }}.md"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
              --ed-key-file - \
              --download-url-prefix "https://github.com/koenigderorangen/DeskBuddy/releases/download/${{ steps.version.outputs.tag }}/" \
              --link "https://github.com/koenigderorangen/DeskBuddy" \
              --embed-release-notes \
              -o sparkle-release/appcast.xml \
              sparkle-release

      - name: Publish GitHub Release
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ steps.version.outputs.tag }}"
          "DeskBuddy-${{ steps.version.outputs.version }}.dmg"
          "sparkle-release/appcast.xml"
          --target "$GITHUB_SHA"
          --title "DeskBuddy ${{ steps.version.outputs.version }}"
          --notes-file release-notes.md
